<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#121219" />
    <script>
      // Apply the theme before first paint so there is no flash. Mirrors
      // src/lib/theme.ts, which takes over once the app loads.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("prismy:theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        var root = document.documentElement;
        root.classList.toggle("dark", theme === "dark");
        root.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", theme === "dark" ? "#121219" : "#f9f9fc");
      })();
    </script>
    <title>Prismy</title>
    <meta
      name="description"
      content="See your impact through GitHub pull requests: throughput, code volume and cycle time across every repo you contribute to."
    />
    <!-- Link previews need absolute URLs, so these point at production. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="prismy.lgtm.page" />
    <meta property="og:title" content="Prismy" />
    <meta
      property="og:description"
      content="See your impact through GitHub pull requests: throughput, code volume and cycle time across every repo you contribute to."
    />
    <meta property="og:url" content="https://prismy.lgtm.page/" />
    <meta property="og:image" content="https://prismy.lgtm.page/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Prismy: a prism splitting a beam into bars, beside a weekly merged-PR chart."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Prismy" />
    <meta
      name="twitter:description"
      content="See your impact through GitHub pull requests."
    />
    <meta name="twitter:image" content="https://prismy.lgtm.page/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
