name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel an in-flight main run (it may be deploying).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The validate container's tag must match the locked @playwright/test, and
  # `container.image` can only read `needs` outputs, so resolve it first.
  playwright-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: pnpm-lock.yaml
          sparse-checkout-cone-mode: false

      - id: resolve
        run: |
          version="$(grep -m1 -oP "^  '@playwright/test@\K[0-9.]+" pnpm-lock.yaml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  validate:
    needs: playwright-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Browsers and their system libraries come preinstalled, so no step
    # depends on an apt mirror (one once took 35 minutes for install-deps).
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v5

      # pnpm version resolves from the packageManager field in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Format check + typecheck + lint + unit tests + e2e against the local
      # Worker (specs stub /api/apps, so no live apps are fetched).
      - run: pnpm validate

      # validate doesn't build; catch build-only regressions here.
      - run: pnpm build

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
